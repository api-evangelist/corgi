aid: corgi
name: Corgi
description: Corgi is an AI-native, full-stack business insurance platform for startups, offering
  modular coverage (Commercial General Liability, Directors & Officers, Tech Errors & Omissions, Cyber,
  EPLI, and fiduciary) quoted in minutes. Founded in 2024 and based in San Francisco, Corgi is a licensed
  insurance carrier rather than a broker, underwriting and issuing policies directly with pricing tailored
  to a startup's stage (pre-seed, Series A, growth). Backed by Kindred Ventures and TCV, the company was
  reported as an AI insurance unicorn in 2026. This API Evangelist profile was seeded from Kindred
  Ventures' portfolio; Corgi does not currently publish a public API or developer portal.
